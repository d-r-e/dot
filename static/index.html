<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090a10" />
    <title>dot</title>
    <link rel="stylesheet" href="/static/style.css?v=6" />
  </head>
  <body>
    <main>
      <div class="dot-stage">
        <button id="dot" class="dot" type="button" data-state="starting" aria-label="Asistente local">
          <span class="dot-body" aria-hidden="true">
            <span class="dot-halo"></span>
            <span class="dot-ring"></span>
            <span class="dot-voice"><span class="dot-core"></span></span>
          </span>
          <span id="status" class="sr-only" role="status" aria-live="polite">Iniciando</span>
        </button>
        <span id="hint" class="hint" aria-hidden="true">
          <span class="hint-pip"></span>
          <span id="hint-text" class="hint-text"></span>
          <span class="hint-dots"><i></i><i></i><i></i></span>
        </span>
      </div>
      <section id="conversation" class="conversation" aria-label="Conversación">
        <div id="messages" class="messages" role="log" aria-label="Historial de conversación" aria-live="polite" aria-relevant="additions text" tabindex="0"></div>
        <form id="compose" class="compose">
          <label class="sr-only" for="message">Escribe un mensaje. Intro para enviar; Mayús e Intro para una nueva línea.</label>
          <textarea id="message" name="message" rows="1" maxlength="8000" placeholder="Escribe…" enterkeyhint="send" autocomplete="off" spellcheck="true"></textarea>
          <button class="sr-only" type="submit" tabindex="-1">Enviar mensaje</button>
          <span id="chat-status" class="sr-only" role="status" aria-live="polite"></span>
        </form>
      </section>
    </main>
    <script src="/static/app.js?v=6" type="module"></script>
  </body>
</html>
